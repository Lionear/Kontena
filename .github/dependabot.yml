version: 2

# The workflows pin actions to a commit SHA rather than a tag (KON-186), because a tag can be moved
# under us and the release job publishes with contents: write. A pin only stays a good idea if
# something keeps it current, so Dependabot does: it opens a PR that bumps the SHA and rewrites the
# trailing version comment.
updates:
  - package-ecosystem: github-actions
    directory: /
    # develop, not the default branch (KON-313). main only moves at a release — the promote in
    # CONTRIBUTING is a fast-forward for that reason — and a bump landing there directly also
    # refreshes the preview release from workflow files develop does not have. Worse, the two sides
    # then hold different pins for the same line, and a pin is one SHA: that merge has no "keep
    # both" resolution, so it resolves to one of them and the bump goes quietly missing.
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
