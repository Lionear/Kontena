name: Tests

# Runs the unit tests on every PR and on pushes to main and develop, so a regression is caught before
# it reaches a build. develop is the integration branch (feature branches PR into it; develop promotes
# to main for releases). The Docker adapter suite talks to a real engine when one is present and skips
# cleanly when it isn't (SkippableFact), so it stays green on runners without Docker.
on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".idea/**"
      - "**/*.DotSettings*"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".idea/**"
      - "**/*.DotSettings*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test (Core)
        run: dotnet test tests/Kontena.Core.Tests/Kontena.Core.Tests.csproj -c Release

      - name: Test (Engines)
        run: dotnet test tests/Kontena.Engines.Tests/Kontena.Engines.Tests.csproj -c Release

      - name: Test (Core.Orchestration)
        run: dotnet test tests/Kontena.Core.Orchestration.Tests/Kontena.Core.Orchestration.Tests.csproj -c Release

      # Integration tests against a real Docker engine; each test skips cleanly when Docker is absent.
      - name: Test (Adapters.Docker)
        run: dotnet test tests/Kontena.Adapters.Docker.Tests/Kontena.Adapters.Docker.Tests.csproj -c Release

      # Same shape for Kubernetes: the mapper and metrics units always run, and the tests that need a
      # real cluster skip cleanly when the runner has no kubeconfig.
      - name: Test (Adapters.Kubernetes)
        run: dotnet test tests/Kontena.Adapters.Kubernetes.Tests/Kontena.Adapters.Kubernetes.Tests.csproj -c Release

      # The kind provisioner is driven through the tool seam's fake, so the unit tests need no cluster
      # tooling; the two read-only tests against a real kind skip cleanly when the runner has none.
      - name: Test (Adapters.LocalClusters)
        run: dotnet test tests/Kontena.Adapters.LocalClusters.Tests/Kontena.Adapters.LocalClusters.Tests.csproj -c Release

      # Keep THIRD-PARTY-NOTICES.md in sync with the dependency closure.
      - name: Check third-party notices
        run: |
          dotnet restore
          python3 tools/generate-third-party-notices.py --check
