name: Tests

# Runs the unit tests on every PR and on pushes to main and develop, so a regression is caught before
# it reaches a build. develop is the integration branch (feature branches PR into it; develop promotes
# to main for releases).
#
# The whole solution, not a list of projects. The list this used to hold named six of the thirteen test
# projects — Kontena.App.Tests, the largest suite, was not one of them — so a regression there passed the
# gate and surfaced at the develop -> main promotion instead, where ci.yml does run the solution. A list
# that has to be extended by hand every time a test project is added is a gate that quietly narrows
# (KON-384).
#
# Still one runner: ci.yml keeps the three-OS matrix on main, and duplicating it here would double every
# PR's wait for a platform difference the promotion catches anyway.
on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".idea/**"
      - "**/*.DotSettings*"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".idea/**"
      - "**/*.DotSettings*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # The adapter suites talk to a real engine, cluster or kind when the runner has one and skip
      # cleanly when it does not (SkippableFact), so this stays green on a bare runner.
      - name: Test
        run: dotnet test Kontena.slnx -c Release

      # Keep THIRD-PARTY-NOTICES.md in sync with the dependency closure.
      - name: Check third-party notices
        run: |
          dotnet restore
          python3 tools/generate-third-party-notices.py --check
