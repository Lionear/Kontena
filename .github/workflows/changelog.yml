name: Changelog

# Validates the changelog fragments in changelog.d/ (KON-104). Deliberately its own workflow rather
# than a step in Tests: that one skips markdown-only changes (paths-ignore "**.md"), which is
# precisely the shape of a pull request that adds nothing but a fragment — the case this check
# exists for.
#
# It only checks names. A fragment called KON-107.fix.md (no such category) would otherwise be
# skipped in silence at release time, and the entry would quietly never appear in the changelog.
on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fragments:
    name: Changelog fragments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the guard below diffs against the base branch

      - name: Validate fragment names
        run: python3 tools/changelog-render.py --check

      # The check above only ever sees the fragments that are there — never the branch that wrote
      # into CHANGELOG.md instead of adding one. Two did, on one day, and both went green: KON-372
      # merged that way and KON-374 was caught by hand (KON-376).
      #
      # Added lines only, and only inside [Unreleased] — that is the section the release writes, and
      # the only one a branch can bypass a fragment into. Released sections are explicitly editable
      # (changelog.d/README.md, "Still edit CHANGELOG.md directly?"): correcting text that already
      # shipped replaces a line, so a whole-file check refused the one edit the convention allows.
      # Moving an entry out into a fragment, or dropping one, is how a mistake gets corrected, and
      # that is all removals. A release promotion (develop -> main) carries the roll's own edit and
      # is skipped whole.
      - name: CHANGELOG.md is written by the release, not by a branch
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          unreleased() {
            git show "$1:CHANGELOG.md" | awk '/^## \[Unreleased\]/ { f = 1; next } /^## \[/ { f = 0 } f'
          }
          if diff <(unreleased "origin/$BASE") <(unreleased HEAD) | grep -q '^>'; then
            echo "::error file=CHANGELOG.md::Entries go in changelog.d/<ticket>.<category>.md, which the release folds in here — see changelog.d/README.md and CONTRIBUTING.md."
            exit 1
          fi

      # Shows the maintainer what the next release's notes will read like, without changing anything.
      - name: Preview the Unreleased section
        run: python3 tools/changelog-render.py --dry-run
