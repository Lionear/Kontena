name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Building and testing needs nothing but the source. Without this block the job would inherit the
# repository default for GITHUB_TOKEN, which can be write — the other workflows all say read.
permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Kontena.slnx

      - name: Build
        run: dotnet build Kontena.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Kontena.slnx --configuration Release --no-build --verbosity normal
