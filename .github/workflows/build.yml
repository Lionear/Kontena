name: Build

# Cross-platform release builds:
#   push main        -> refreshes the rolling `preview` prerelease (what has been merged)
#   push tag v*      -> cuts a real, latest `stable` release, rolls the changelog on main and
#                       opens a PR syncing that roll back to develop
#   schedule         -> refreshes the rolling `nightly` prerelease from develop (KON-108)
#   workflow_dispatch -> manual build of main, optionally refreshing the preview release;
#                        tick `nightly` to exercise the scheduled path instead
#
# develop is the integration branch and main only moves at a release, so without the nightly there
# is no built artifact of what is finished between two releases — which is exactly what a pipeline
# is for on the platforms you cannot build locally.
#
# NOTE: scheduled workflows only ever run from the default branch, so the cron here is dormant until
# this file reaches main.
#
# Builds are unsigned / not notarized for now (see the release notes footer).
on:
  schedule:
    # 03:00 UTC — after a European working day, before the next one.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version stamp (leave empty to derive from Directory.Build.props)"
        required: false
        default: ""
      publish_release:
        # This gates the release job for *every* channel, not just preview: a manual run publishes
        # nothing without it. Named for what it does, after a nightly dispatch built all three
        # platforms and then published none of them.
        description: "Publish the release for this channel (a manual run builds only, without it)"
        type: boolean
        required: false
        default: false
      nightly:
        description: "Build develop as the nightly prerelease instead of main"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".idea/**"
      - "**/*.DotSettings*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decide once what we build and where it lands, so the build matrix and release job can't disagree.
  setup:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.target.outputs.channel }}
      release_tag: ${{ steps.target.outputs.release_tag }}
      version: ${{ steps.target.outputs.version }}
      build_date: ${{ steps.target.outputs.build_date }}
      ref: ${{ steps.target.outputs.ref }}
      should_build: ${{ steps.target.outputs.should_build }}
    steps:
      # A nightly builds develop, not the branch the schedule fires from (which is always the
      # default branch).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event_name == 'schedule' || inputs.nightly) && 'refs/heads/develop' || github.ref }}

      - name: Resolve channel and version
        id: target
        # Workflow inputs reach bash through env, never through `${{ }}`: GitHub substitutes those
        # textually before the shell parses the line, so an input could close the quote and append
        # commands. Env values are data to bash, whatever they contain.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          IS_NIGHTLY: ${{ github.event_name == 'schedule' || inputs.nightly }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          SHOULD_BUILD=true

          # Stamped into the binaries so About can say when a build was made. Resolved once, here,
          # rather than per platform: three runners crossing midnight would otherwise disagree about
          # the date of the same build.
          BUILD_DATE=$(date -u +%Y-%m-%d)
          # Written as an if, not `[ ... ] && REF=...`: under `set -e` a failing test as the whole
          # statement ends the step, which would kill every non-tag build.
          if [ "$REF_TYPE" = tag ]; then
            REF="refs/tags/$REF_NAME"
          else
            REF="refs/heads/$REF_NAME"
          fi

          if [ "$IS_NIGHTLY" = true ]; then
            CHANNEL=nightly
            RELEASE_TAG=nightly
            BASE=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props)
            [ -n "$BASE" ] || { echo "No <Version> in Directory.Build.props" >&2; exit 1; }
            # The run number alone, no date: it already increases on every run, and the date made the
            # version long enough that nobody read it. The build date is stamped into the binary
            # instead, where it is information rather than an ordering key (KON-268).
            #
            # The one thing that can break this: `github.run_number` restarts at 1 if build.yml is
            # renamed or deleted and recreated. The version would then go *backwards* and the nightly
            # channel would quietly stop offering updates, because Velopack only offers a version
            # greater than the installed one. Renaming this file means bumping <Version> with it.
            VERSION="$BASE-nightly.$RUN_NUMBER"

            # Republishing an identical build every night makes "there is a new nightly" meaningless.
            # The previous nightly already carries the commit it was cut from, so this is a
            # comparison rather than state we have to keep somewhere.
            HEAD_SHA=$(git rev-parse HEAD)
            PREV_SHA=$(gh release view nightly --json targetCommitish -q .targetCommitish 2>/dev/null || true)
            if [ "$HEAD_SHA" = "$PREV_SHA" ]; then
              echo "develop has not moved since the last nightly ($HEAD_SHA) — skipping."
              SHOULD_BUILD=false
            fi

            # Everything downstream uses this exact commit rather than "whatever develop is now", so a
            # merge landing mid-build cannot make the assets, the release target and the next run's
            # comparison disagree.
            REF="$HEAD_SHA"
          elif [ "$REF_TYPE" = tag ]; then
            # A tag build must be a plain v<major>.<minor>.<patch> (it becomes a checkout ref = code
            # execution), and nothing else.
            #
            # The prerelease part used to be allowed, and a tag is unconditionally CHANNEL=stable, so
            # v0.2.0-rc.1 published a release candidate to the stable feed, pointed GitHub's "Latest
            # release" at it, and rolled [Unreleased] into [0.2.0-rc.1] on main — deleting the
            # changelog fragments, so the real 0.2.0 would have shipped with empty notes. All while
            # the build reported success (KON-124).
            if ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Refusing tag ref: $REF_NAME" >&2
              echo "A tag build is a release: it publishes to the stable channel, becomes the latest" >&2
              echo "release, and rolls the changelog. Only vMAJOR.MINOR.PATCH does that." >&2
              echo "For a build ahead of stable, use the preview channel (run this workflow from main)" >&2
              echo "or the nightly one — neither disturbs stable users or the changelog." >&2
              exit 1
            fi
            CHANNEL=stable
            RELEASE_TAG="$REF_NAME"
            VERSION="${REF_NAME#v}"
          else
            CHANNEL=preview
            RELEASE_TAG=preview
            if [ -n "${INPUT_VERSION:-}" ]; then
              VERSION="$INPUT_VERSION"
            else
              BASE=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props)
              [ -n "$BASE" ] || { echo "No <Version> in Directory.Build.props" >&2; exit 1; }
              VERSION="$BASE-preview.$RUN_NUMBER"
            fi
          fi

          # This value later reaches MSBuild args and file names. Keeping it boring (letters/digits/
          # dot/plus/hyphen) is the backstop that also blocks a newline forging output.
          if ! printf '%s' "$VERSION" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9.+-]*$'; then
            echo "Refusing version '$VERSION'" >&2; exit 1
          fi

          {
            echo "channel=$CHANNEL"
            echo "release_tag=$RELEASE_TAG"
            echo "version=$VERSION"
            echo "build_date=$BUILD_DATE"
            echo "ref=$REF"
            echo "should_build=$SHOULD_BUILD"
          } >> "$GITHUB_OUTPUT"
          echo "Building channel '$CHANNEL' from '$REF' (assets on '$RELEASE_TAG'), version $VERSION"

  build:
    name: ${{ matrix.name }}
    needs: setup
    if: ${{ needs.setup.outputs.should_build == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
            platform: win
            mainExe: Kontena.App.exe
            # No PublishSingleFile: the updater replaces an application *folder* and patches it with
            # deltas, so it needs the files as files. A self-extracting single exe defeats both.
            publishArgs: ""
          - name: Linux AppImage
            os: ubuntu-latest
            rid: linux-x64
            platform: linux
            mainExe: Kontena.App
            publishArgs: ""
          - name: macOS Apple Silicon
            os: macos-14
            rid: osx-arm64
            platform: osx
            mainExe: Kontena.App
            publishArgs: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: version
        shell: bash
        env:
          VERSION_IN: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="$VERSION_IN"
          if ! printf '%s' "$VERSION" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9.+-]*$'; then
            echo "Refusing version '$VERSION'" >&2; exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/Kontena.App/Kontena.App.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:Version=${{ steps.version.outputs.value }} \
            -p:BuildDate=${{ needs.setup.outputs.build_date }} \
            ${{ matrix.publishArgs }} \
            -o publish/${{ matrix.rid }}

      # Packaging is Velopack's (KON-110). It produces the user-facing download *and* the update
      # package and feed for the same channel in one step, which is the point: an installer built
      # separately from the feed is an installer the updater cannot follow.
      - name: Install vpk
        shell: bash
        run: dotnet tool install -g vpk --version 1.2.0

      # macOS wants an .icns; the repo carries a .png. Generated here rather than committed, so the
      # icon has one source of truth.
      - name: Build macOS icon
        if: matrix.platform == 'osx'
        shell: bash
        run: |
          set -euo pipefail
          ICONSET=icon.iconset
          mkdir -p "$ICONSET"
          for size in 16 32 64 128 256 512; do
            sips -z $size $size src/Kontena.App/Assets/icon.png --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            sips -z $((size*2)) $((size*2)) src/Kontena.App/Assets/icon.png --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o icon.icns

      - name: Package (vpk)
        shell: bash
        env:
          # The channel carries the platform: one feed per platform per stream, because a feed that
          # mixed them would offer a Windows package to a Linux install. Mirrors
          # Kontena.Core.Models.ReleaseChannel, which is what the app asks for.
          CHANNEL: ${{ matrix.platform }}-${{ needs.setup.outputs.channel }}
          VERSION: ${{ steps.version.outputs.value }}
          RID: ${{ matrix.rid }}
          MAIN_EXE: ${{ matrix.mainExe }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          EXTRA=()
          case "$PLATFORM" in
            osx)   ICON=icon.icns ;;
            win)   ICON=src/Kontena.App/Assets/icon.ico ;;
            *)     ICON=src/Kontena.App/Assets/icon.png
                   # Same desktop-menu categories the hand-rolled .desktop entry carried.
                   EXTRA+=(--categories "Development;System") ;;
          esac

          # ${EXTRA[@]+…}, not "${EXTRA[@]}": macOS runners ship bash 3.2, which under `set -u`
          # treats an empty array's expansion as an unbound variable and kills the step. The guarded
          # form expands to nothing at all when the array is empty, and is a no-op on bash 5.
          vpk pack ${EXTRA[@]+"${EXTRA[@]}"} \
            --packId Kontena \
            --packTitle Kontena \
            --packAuthors Lionear \
            --packVersion "$VERSION" \
            --packDir "publish/$RID" \
            --mainExe "$MAIN_EXE" \
            --icon "$ICON" \
            --channel "$CHANNEL" \
            --outputDir artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.rid }}
          path: artifacts/*
          retention-days: 14
          if-no-files-found: error

  # The nerdctl plugin does not ship in the box (Plans/plugin-loader.md §5): it is its own zip,
  # unpacked by hand today and by the plugin store later — which is the point, since the in-the-box
  # route would prove only that the loader can load one dll, not that downloading, unpacking and
  # consenting work.
  #
  # Its own job rather than a step in the matrix above: the plugin is one platform-independent
  # assembly, so building it three times would produce three identical zips racing for one asset name.
  plugin:
    name: Package nerdctl plugin
    needs: setup
    if: ${{ needs.setup.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Publish and pack the plugin
        shell: bash
        run: |
          set -euo pipefail

          dotnet publish src/Kontena.Plugins.Nerdctl/Kontena.Plugins.Nerdctl.csproj \
            -c Release -o plugin-publish

          # The plugin's own version, not the app's: it is what plugin.json declares, what the host
          # keys consent on (id@version), and what the store will compare to decide there is a newer
          # one. Read from the manifest so there is a single place to bump it.
          VERSION=$(python3 -c 'import json,sys; print(json.load(open("src/Kontena.Plugins.Nerdctl/plugin.json"))["version"])')
          if ! printf '%s' "$VERSION" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9.+-]*$'; then
            echo "Refusing plugin version '$VERSION'" >&2; exit 1
          fi

          # Kontena.Sdk is the contract, not a dependency to carry: PluginLoadContext hands the plugin
          # the host's already-loaded copy, so a second one in the zip is never loaded — it can only
          # be a differently-built assembly of the same name sitting next to the plugin.
          rm -f plugin-publish/Kontena.Sdk.dll plugin-publish/Kontena.Sdk.pdb

          # Both files are what the loader looks for by name. A zip missing either is a plugin the
          # host silently refuses, so this fails here instead of on a user's machine.
          test -f plugin-publish/plugin.json
          test -f plugin-publish/Kontena.Plugins.Nerdctl.dll

          mkdir -p artifacts
          (cd plugin-publish && zip -qr "../artifacts/kontena-plugin-nerdctl-$VERSION.zip" .)
          ls -l artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-nerdctl
          path: artifacts/*
          retention-days: 14
          if-no-files-found: error

  # Publishes the channel's release. Preview is a rolling prerelease; Stable is a real latest release
  # on the v-tag, after which the changelog's [Unreleased] section is rolled into [VERSION] on main
  # and that roll is offered back to develop as a PR (KON-127) — main and develop must not end up
  # disagreeing about a file where every conflict resolves to "keep both".
  release:
    name: Publish ${{ needs.setup.outputs.channel }} release
    needs: [setup, build, plugin]
    if: ${{ needs.setup.outputs.should_build == 'true' && (github.event_name == 'push' || github.event_name == 'schedule' || inputs.publish_release) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write   # open the changelog-roll sync PR back to develop (stable only, KON-127)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHANNEL: ${{ needs.setup.outputs.channel }}
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail

          # One flat dir for the upload glob.
          mkdir -p assets
          find dist -type f -exec cp {} assets/ \;

          # Release notes are the maintainer-curated CHANGELOG.md [Unreleased] section, not the git log.
          # Fold the changelog fragments (changelog.d/, KON-104) into [Unreleased] first — that is where
          # the pending entries live between releases, so the notes below would otherwise be empty. It
          # edits the working tree only; the roll further down commits the result.
          python3 tools/changelog-render.py || true

          CHANGELOG=CHANGELOG.md tools/changelog-unreleased.sh > notes.md || true
          [ -s notes.md ] || echo "No changes recorded." > notes.md

          BODY="$(cat notes.md)

          These builds are unsigned / not notarized.
          Linux: the .AppImage is self-contained — chmod +x and run it.
          macOS: run the Setup .pkg, or unzip the portable build — then clear quarantine before first
          launch: xattr -cr Kontena.app.
          Windows: run the Setup .exe, or unzip the portable build; SmartScreen may warn on first launch.

          Installed copies update themselves from here — see Settings → Updates.
          The .nupkg and releases.*.json assets are what the updater reads; you do not need to download them.

          kontena-plugin-nerdctl-*.zip is optional and separate from the app: it adds containerd
          backends through the nerdctl CLI, one per containerd namespace. Unzip it into
          %APPDATA%\\Lionear\\Kontena\\plugins\\nerdctl\\ (Windows) or
          ~/.config/Lionear/Kontena/plugins/nerdctl/ (Linux, macOS), then start Kontena and approve it
          when asked. It needs nerdctl on the machine; it does not install one."

          if [ "$CHANNEL" = stable ]; then
            TARGET=$(git rev-parse "${RELEASE_TAG}^{commit}")
            gh release delete "$RELEASE_TAG" --yes || true
            gh release create "$RELEASE_TAG" assets/* \
              --title "Kontena $VERSION" --notes "$BODY" --latest --target "$TARGET"

            # Roll [Unreleased] into [VERSION] on main and push it back. Rendering again here is not a
            # repeat of the fold above: that one ran on the built ref and was never committed, while
            # this runs on main, where the fragments still exist and must be removed by the same commit
            # that archives their text. Only markdown changes (CHANGELOG.md plus the fragment
            # deletions), and *.md is in paths-ignore, so the commit-back never re-triggers a build.
            # Best-effort — a push race must never fail an already-published release.
            if git fetch origin main \
               && git checkout -B main origin/main \
               && python3 tools/changelog-render.py \
               && VERSION="$VERSION" DATE="$(date -u +%Y-%m-%d)" REPO="$GH_REPO" \
                    CHANGELOG=CHANGELOG.md tools/changelog-roll.sh \
               && ! git diff --quiet -- CHANGELOG.md changelog.d; then
              git config user.name  "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              # -A so the folded-in fragments are removed by the same commit that archives them.
              git add -A CHANGELOG.md changelog.d
              git commit -m "chore(release): roll changelog for $VERSION"
              if git push origin main; then
                ROLL_SHA=$(git rev-parse HEAD)

                # The roll only happened on main. develop still carries the shipped notes under
                # [Unreleased] plus the fragments that were just archived, so from here on the two
                # branches disagree about a file whose merge conflicts carry no information — both
                # sides are additions and the answer is always "keep both". At 0.2.0 this was fixed by
                # hand; SQL Explorer let it slide twice in a row (KON-127).
                #
                # A PR rather than a direct push: a fast-forward only works while develop has not
                # moved, and the moment it has, the cherry-pick conflicts. The PR is where that gets
                # resolved by a human instead of by a workflow guessing.
                #
                # Best-effort throughout: the release is already published, and nothing here may turn
                # a shipped release into a red build.
                SYNC_BRANCH="chore/changelog-roll-$VERSION"
                if ! git ls-remote --exit-code --heads origin develop >/dev/null 2>&1; then
                  # develop is gone. Merging a release PR with "delete branch" deletes the integration
                  # branch itself — that is how SQL Explorer lost it at 0.5.0. Nothing can have been
                  # lost in that state, because main's head is the roll on top of everything develop
                  # held, so recreate it there rather than only warn: that is what the sync PR would
                  # have produced anyway. Safe *only* because the branch is absent — never force one
                  # that exists.
                  if git push origin "$ROLL_SHA:refs/heads/develop"; then
                    echo "::warning::develop was missing (deleted by the release merge?) and has been recreated at the changelog roll ($ROLL_SHA)"
                  else
                    echo "::warning::develop is missing and could not be recreated; branch it off main by hand"
                  fi
                elif git fetch origin develop && git checkout -B "$SYNC_BRANCH" origin/develop; then
                  # Did develop edit CHANGELOG.md itself since the roll's parent? Normally no — entries
                  # live in changelog.d/ since KON-104, so develop never touches the file and the
                  # cherry-pick is a clean replay. When it *has*, git merges the two versions without
                  # conflicting and quietly files develop's pending line under the version that just
                  # shipped. A probe of this workflow reproduced exactly that. It is not wrong enough
                  # to refuse the sync, but it is never right to merge unread, so the PR says so.
                  REVIEW_NOTE=""
                  if ! git diff --quiet "$ROLL_SHA^" HEAD -- CHANGELOG.md; then
                    # printf, not a multi-line string: this sits inside a YAML block scalar, where a
                    # line starting at column 0 would end the block instead of continuing the value.
                    REVIEW_NOTE=$(printf '\n\n**Read this one before merging.** develop edited `CHANGELOG.md` directly while the release was being cut, so this is a real merge rather than a replay. Git resolves those two sections without reporting a conflict, which means a pending entry can land under `[%s]` — a version that is already published. Check that `[%s]` holds only what shipped and that anything still pending is back under `[Unreleased]`.' "$VERSION" "$VERSION")
                    echo "::warning::develop had its own CHANGELOG.md edits; the sync PR needs a read before merging (entries can land under [$VERSION] without a conflict)"
                  fi

                  if git cherry-pick -x "$ROLL_SHA"; then
                    if git push -f origin "$SYNC_BRANCH"; then
                      gh pr create --base develop --head "$SYNC_BRANCH" \
                        --title "chore(release): sync $VERSION changelog roll to develop" \
                        --body "Automated after the $VERSION release: cherry-picks the changelog roll ($ROLL_SHA) so develop files the shipped notes under \`[$VERSION]\` and drops the fragments that went with them. Merge to keep \`[Unreleased]\` honest.$REVIEW_NOTE" \
                        || echo "::warning::changelog sync PR create failed; open a develop<-main changelog PR by hand"
                    else
                      echo "::warning::changelog sync branch push failed; open a develop<-main changelog PR by hand"
                    fi
                  else
                    git cherry-pick --abort || true
                    echo "::warning::changelog roll conflicts on develop; open a develop<-main changelog PR and resolve [Unreleased] by hand"
                  fi
                else
                  echo "::warning::could not check out develop for changelog sync; open a develop<-main changelog PR by hand"
                fi
              else
                echo "::warning::changelog roll-back push failed; roll [Unreleased] into [$VERSION] by hand"
              fi
            else
              echo "::warning::changelog roll skipped (nothing to roll or checkout failed); verify CHANGELOG.md"
            fi
          else
            # Rolling channels (nightly, preview): the release is replaced on every run.
            #
            # It used to be deleted first and rebuilt afterwards, which left the channel with no
            # RELEASES-* asset for the three to four minutes the uploads took — every updater that
            # checked in that window got a 404 and told its user to check their connection (KON-163).
            # A nightly window is not an incident; it is every night.
            #
            # So: upload everything into a draft first, under a staging tag that no updater reads.
            # Nothing user-visible changes while that runs. Only once every asset is in place is the
            # old release dropped and the draft published onto the channel's tag — one API call, so
            # the gap goes from minutes to about a second.
            if [ "$CHANNEL" = nightly ]; then
              # The commit setup pinned, which is what was built and what the next run compares
              # against (gh release view nightly --json targetCommitish). Publishing the draft creates
              # the tag at this commit, so that comparison keeps working.
              TARGET=$(git rev-parse HEAD)
              TITLE="Nightly build (develop)"
            else
              TARGET="$GITHUB_SHA"
              TITLE="Preview build (main)"
            fi

            STAGING_TAG="$RELEASE_TAG-staging-$GITHUB_RUN_ID"

            # A draft left behind by a re-run of this same run id would collide with the create below.
            gh release delete "$STAGING_TAG" --yes || true

            gh release create "$STAGING_TAG" assets/* --draft \
              --title "$TITLE" --notes "$BODY" --prerelease --target "$TARGET"

            # From here the channel is briefly without a release, so a failure must be loud: the
            # assets exist, they are simply still in the draft, and the fix is to publish it.
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
            if ! gh release edit "$STAGING_TAG" \
                   --tag "$RELEASE_TAG" --target "$TARGET" --draft=false --prerelease; then
              echo "::error::publishing $STAGING_TAG onto $RELEASE_TAG failed — the channel has no release."
              echo "::error::The assets are in the draft: gh release edit $STAGING_TAG --tag $RELEASE_TAG --draft=false --prerelease"
              exit 1
            fi
          fi
